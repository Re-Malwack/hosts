name: Update Hosts & Blocklists

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: true

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: ZG089
  GIT_AUTHOR_EMAIL: 159061718+ZG089@users.noreply.github.com
  GIT_COMMITTER_NAME: ZG089
  GIT_COMMITTER_EMAIL: 159061718+ZG089@users.noreply.github.com
  # Keep scripts/__pycache__ out of the work tree: history is rebuilt with `git add -A`.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # History is rewritten on every run, so only the current tip is needed.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Save pre-update state
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # Used later to show per-list changes in the commit message.
          if git cat-file -e HEAD:stats.json 2>/dev/null; then
            git show HEAD:stats.json > "$RUNNER_TEMP/stats.previous.json"
          fi

      # The scripts rebuild hosts/ and blocklists/ (with their .count files),
      # rewrite the tables in README.md, refresh stats.json and write the
      # SHA-256 manifest to checksums.txt.
      - name: Update hosts, blocklists, checksums and README
        run: |
          python scripts/update.py
          python scripts/update_blocklists.py

      # Rebuild history as exactly two commits and force-push them:
      #   1. hosts/, blocklists/, counts and checksums.txt (plus everything else
      #      in the repo, including any commits added since the last run)
      #   2. README.md and stats.json
      - name: Rewrite history as two commits and force push
        run: |
          set -euo pipefail

          # Messages are built from the freshly generated stats.json.
          python scripts/commit_message.py data \
            --previous "$RUNNER_TEMP/stats.previous.json" \
            --run "$GITHUB_RUN_NUMBER" > "$RUNNER_TEMP/data-message.txt"
          python scripts/commit_message.py docs > "$RUNNER_TEMP/docs-message.txt"

          # Set the updated README and stats aside so they can form commit 2.
          mkdir -p "$RUNNER_TEMP/updated"
          cp README.md stats.json "$RUNNER_TEMP/updated/"

          # Commit 1: a root commit holding the whole tree, with README.md and
          # stats.json still in their pre-update state.
          git checkout -q --orphan rewrite
          git read-tree --empty
          git show "$BASE_SHA:README.md" > README.md
          if git cat-file -e "$BASE_SHA:stats.json" 2>/dev/null; then
            git show "$BASE_SHA:stats.json" > stats.json
          else
            rm -f stats.json
          fi
          git add -A
          git commit -q -F "$RUNNER_TEMP/data-message.txt"

          # Commit 2: the README and stats updates.
          cp "$RUNNER_TEMP/updated/README.md" "$RUNNER_TEMP/updated/stats.json" .
          git add README.md stats.json
          if git diff --cached --quiet; then
            echo "README.md and stats.json are unchanged; pushing a single commit"
          else
            git commit -q -F "$RUNNER_TEMP/docs-message.txt"
          fi

          # Nothing generated may be left out, and history must stay at two commits.
          test -z "$(git status --porcelain)"
          test "$(git rev-list --count HEAD)" -le 2
          git --no-pager log --format='%h %s'

          # Force push, but refuse to overwrite anything pushed since checkout.
          git push --force-with-lease="main:$BASE_SHA" origin HEAD:main

      - name: Create Archive Files
        run: |
          cd hosts && zip -qr ../hosts.zip . && cd ..
          cd blocklists && zip -qr ../blocklists.zip . && cd ..
          mkdir -p _all
          cp -r hosts/. _all/
          cp -r blocklists/. _all/
          cd _all && zip -qr ../hosts-and-blocklists.zip . && cd ..
          rm -rf _all

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          LATEST=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$LATEST" ]; then
            NEXT="v1"
          else
            TAG="${LATEST#v}"
            if [[ "$TAG" == *.* ]]; then
              NEXT="v${TAG%%.*}.$((10#${TAG#*.} + 1))"
            else
              NEXT="v${TAG}.1"
            fi
          fi
          echo "Publishing release: $NEXT"
          NOTES=$(printf 'Automated release for run #%s\n\n**Released:** %s' "${{ github.run_number }}" "$RELEASE_DATE")
          gh release create "$NEXT" --title "$NEXT" --notes "$NOTES" \
             hosts.zip blocklists.zip hosts-and-blocklists.zip
