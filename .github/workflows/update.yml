name: Update Hosts & Blocklists

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Update Scripts
        run: |
          python scripts/update.py
          python scripts/update_blocklists.py

      - name: Keep repo history at 2 commits max
        env:
          GIT_AUTHOR_NAME: ZG089
          GIT_AUTHOR_EMAIL: 159061718+ZG089@users.noreply.github.com
          GIT_COMMITTER_NAME: ZG089
          GIT_COMMITTER_EMAIL: 159061718+ZG089@users.noreply.github.com
        run: |
          set -euo pipefail

          CURRENT_COUNT=$(git rev-list --count HEAD)
          echo "Current commits: $CURRENT_COUNT"

          if [ "$CURRENT_COUNT" -gt 2 ]; then
            echo "Resetting to the root commit to collapse history..."
            ROOT_COMMIT=$(git rev-list --max-parents=0 HEAD)
            git reset --soft "$ROOT_COMMIT"
            git reset HEAD
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update hosts and blocklists"
          fi

          FINAL_COUNT=$(git rev-list --count HEAD)
          echo "Final commits: $FINAL_COUNT"

          if [ "$FINAL_COUNT" -le 2 ]; then
            git push --force
            echo "✓ Pushed successfully with $FINAL_COUNT commits"
          else
            echo "⚠ WARNING: Still have $FINAL_COUNT commits after cleanup"
            exit 1
          fi

      - name: Create Archive Files
        run: |
          cd hosts && zip -qr ../hosts.zip . && cd ..
          cd blocklists && zip -qr ../blocklists.zip . && cd ..
          mkdir -p _all
          cp -r hosts/. _all/
          cp -r blocklists/. _all/
          cd _all && zip -qr ../hosts-and-blocklists.zip . && cd ..
          rm -rf _all

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          LATEST=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$LATEST" ]; then
            NEXT="v1"
          else
            TAG="${LATEST#v}"
            if [[ "$TAG" == *.* ]]; then
              NEXT="v${TAG%%.*}.$((10#${TAG#*.} + 1))"
            else
              NEXT="v${TAG}.1"
            fi
          fi
          echo "Publishing release: $NEXT"
          NOTES=$(printf 'Automated release for run #%s\n\n**Released:** %s' "${{ github.run_number }}" "$RELEASE_DATE")
          gh release create "$NEXT" --title "$NEXT" --notes "$NOTES" \
            hosts.zip blocklists.zip hosts-and-blocklists.zip